services:
  mysql:
    image: mysql:8.4
    container_name: obracontrol-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-obracontrol}
      MYSQL_USER: ${DB_USER:-obracontrol}
      MYSQL_PASSWORD: ${DB_PASSWORD:-obracontrol}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: obracontrol-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-obracontrol}
      DB_USER: ${DB_USER:-obracontrol}
      DB_PASSWORD: ${DB_PASSWORD:-obracontrol}
    ports:
      - "8080:8080"

volumes:
  mysql_data: