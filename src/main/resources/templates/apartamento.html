<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Apartamento</title>
  </head>

  <body>
    <section layout:fragment="content">
      <div class="d-flex justify-content-between">
        <h1>Cadastro de Apartamento</h1>
        <button class="btn btn-primary" id="new-apartamento">
          Novo apartamento
        </button>
      </div>

      <div id="apartamento-message" class="alert alert-danger mt-3" role="alert" hidden></div>

      <div class="mb-3" style="max-width: 480px">
        <label for="obra-filtro" class="form-label">Obra:</label>
        <select id="obra-filtro" class="form-select" disabled></select>
      </div>

      <table class="table" id="table_apartamentos">
        <thead>
          <tr>
            <th>ID</th>
            <th>Número</th>
            <th>Obra</th>
            <th>Portas</th>
            <th>Opções</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- Modal -->
      <div class="modal" tabindex="-1" id="modal_apartamento">
        <div class="modal-dialog">
          <form class="modal-content" id="apartamento-form">
            <div class="modal-header">
              <h5 class="modal-title">Cadastrar Novo Apartamento</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body">
              <div id="apartamento-form-message" class="alert alert-danger" role="alert" hidden></div>
              <fieldset id="apartamento-fields">
                <div class="mb-3">
                  <label for="obra" class="form-label">Obra:</label>
                  <select name="obra" id="obra" class="form-select" required disabled></select>
                </div>
                <div class="mb-3">
                  <label for="numero" class="form-label">Número do Apartamento:</label>
                  <input
                    type="text"
                    name="numero"
                    id="numero"
                    class="form-control"
                    required
                    maxlength="50"
                  />
                </div>
              </fieldset>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
              <button
                type="submit"
                id="save-apartamento"
                class="btn btn-primary"
                disabled
              >
                Cadastrar Apartamento
              </button>
            </div>
          </form>
        </div>
      </div>
      <script th:src="@{/apartamento.js}"></script>
    </section>
  </body>
</html>
