<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Prestador de Serviços</title>
  </head>

  <body>
    <section layout:fragment="content">
      <div class="d-flex justify-content-between">
        <h1>Cadastro de Instalador</h1>
        <button
          class="btn btn-primary"
          id="new-instalador"
        >
          Novo instalador
        </button>
      </div>

      <div id="instalador-message" class="alert alert-danger mt-3" role="alert" hidden></div>
      <table class="table" id="table_instaladores">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Telefone</th>
            <th>Opções</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- Modal -->
      <div class="modal" tabindex="-1" id="modal_instalador">
        <div class="modal-dialog">
          <form class="modal-content" id="instalador-form">
            <div class="modal-header">
              <h5 class="modal-title">Cadastrar Novo Instalador</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body">
              <div id="instalador-form-message" class="alert alert-danger" role="alert" hidden></div>
              <fieldset id="instalador-fields">
              <div class="mb-3">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" name="nome" id="nome" class="form-control" required maxlength="200" />
              </div>
              <div class="mb-3">
                <label for="telefone" class="form-label">Telefone:</label>
                <input
                  type="tel"
                  name="telefone"
                  id="telefone"
                  class="form-control"
                  maxlength="30"
                />
              </div>
              </fieldset>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
              <button
                type="submit"
                class="btn btn-primary"
                id="save-instalador"
              >
                Cadastrar Instalador
              </button>
            </div>
          </form>
        </div>
      </div>
      <script th:src="@{/instalador.js}"></script>
    </section>
  </body>
</html>
