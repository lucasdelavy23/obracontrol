<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Cadastro de Obra</title>
  </head>

  <body>
    <section layout:fragment="content">
      <div class="d-flex justify-content-between">
        <h1>Cadastro de Obra</h1>
        <button
          class="btn btn-primary"
          id="new-obra"
        >
          Nova Obra
        </button>
      </div>

      <div id="obra-message" class="alert alert-danger mt-3" role="alert" hidden></div>

      <table class="table" id="table_obra">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nome da Obra</th>
            <th>Construtora</th>
            <th>Cidade</th>
            <th>Endereço</th>
            <th>Opções</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- Modal -->
      <div class="modal" tabindex="-1" id="modal_obra">
        <div class="modal-dialog">
          <form class="modal-content" id="obra-form">
            <div class="modal-header">
              <h5 class="modal-title">Cadastrar Nova Obra</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body">
              <div id="obra-form-message" class="alert alert-danger" role="alert" hidden></div>
              <fieldset id="obra-fields">
              <div class="mb-3">
                <label for="nomeObra" class="form-label">Nome da Obra:</label>
                <input
                  type="text"
                  name="nome"
                  id="nomeObra"
                  required
                  maxlength="200"
                  class="form-control"
                />
              </div>
              <div class="mb-3">
                <label for="construtora" class="form-label">Construtora:</label>
                <select
                  name="construtora"
                  id="construtora"
                  class="form-select"
                  required
                  disabled
                ></select>
              </div>
              <div class="mb-3">
                <label for="estado" class="form-label">Estado:</label>
                <select id="estado" name="estado" class="form-select" required disabled></select>
              </div>
              <div class="mb-3">
                <label for="cidade" class="form-label">Cidade:</label>
                <select
                  name="cidade"
                  id="cidade"
                  class="form-select"
                  required
                  disabled
                ><option value="">Selecione um estado primeiro</option></select>
              </div>
              <div class="mb-3">
                <label for="endereco" class="form-label">Endereço:</label>
                <input
                  type="text"
                  name="endereco"
                  id="endereco"
                  maxlength="300"
                  class="form-control"
                />
              </div>
              </fieldset>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
              <button
                type="submit"
                id="save-obra"
                class="btn btn-primary"
                disabled
              >
                Cadastrar Obra
              </button>
            </div>
          </form>
        </div>
      </div>
      <script th:src="@{/obra.js}"></script>
    </section>
  </body>
</html>
