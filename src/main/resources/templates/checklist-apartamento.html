<!doctype html>
<html
  lang="pt-BR"
  xmlns:th="http://www.thymeleaf.org"
  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{layout/base}"
>
  <head>
    <meta charset="UTF-8" />
    <title>Checklist Apartamento</title>
  </head>

  <body>
    <section layout:fragment="content">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h1>Checklist de Instalação</h1>
          <h5 id="checklist-titulo" class="text-secondary"></h5>
        </div>
        <button class="btn btn-primary" id="new-porta" disabled>
          Nova porta
        </button>
      </div>

      <div
        id="checklist-message"
        class="alert alert-danger mt-3"
        role="alert"
        hidden
      ></div>

      <div class="row g-3 mt-1">
        <div class="col-md-5">
          <label for="obra-filtro" class="form-label">Obra:</label>
          <select id="obra-filtro" class="form-select" disabled></select>
        </div>
        <div class="col-md-4">
          <label for="apartamento-filtro" class="form-label"
            >Apartamento:</label
          >
          <select id="apartamento-filtro" class="form-select" disabled></select>
        </div>
      </div>

      <table class="table align-middle mt-3" id="table_portas">
        <thead>
          <tr id="portas-header-row"></tr>
        </thead>
        <tbody></tbody>
      </table>

      <!-- Modal -->
      <div class="modal" tabindex="-1" id="modal_porta">
        <div class="modal-dialog">
          <form class="modal-content" id="porta-form">
            <div class="modal-header">
              <h5 class="modal-title">Cadastrar Nova Porta</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Fechar"
              ></button>
            </div>
            <div class="modal-body">
              <div
                id="porta-form-message"
                class="alert alert-danger"
                role="alert"
                hidden
              ></div>
              <fieldset id="porta-fields">
                <div class="mb-3">
                  <label for="apartamento" class="form-label"
                    >Apartamento:</label
                  >
                  <select
                    name="apartamento"
                    id="apartamento"
                    class="form-select"
                    required
                    disabled
                  ></select>
                </div>
                <div class="mb-3">
                  <label for="local" class="form-label">Local:</label>
                  <input
                    type="text"
                    name="local"
                    id="local"
                    class="form-control"
                    placeholder="Ex.: Sala de estar"
                    required
                    maxlength="200"
                  />
                </div>
                <div class="mb-3">
                  <label for="instalador" class="form-label">Instalador:</label>
                  <select
                    name="instalador"
                    id="instalador"
                    class="form-select"
                    disabled
                  ></select>
                </div>
              </fieldset>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
              <button
                type="submit"
                id="save-porta"
                class="btn btn-primary"
                disabled
              >
                Cadastrar Porta
              </button>
            </div>
          </form>
        </div>
      </div>
      <script
        th:src="@{/checklist.js(v=${cacheBust})}"
        defer
      ></script>
    </section>
  </body>
</html>
